name: conduit-localnet-importer pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: makerxstudio/conduit-localnet

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1.1.1
        with:
          useConfigFile: true

      - name: Display GitVersion outputs
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "Major: ${{ steps.gitversion.outputs.major }}"
          echo "Minor: ${{ steps.gitversion.outputs.minor }}"
          echo "Patch: ${{ steps.gitversion.outputs.patch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.semVer }}
          labels: |
            org.opencontainers.image.version=${{ steps.gitversion.outputs.semVer }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build summary
        run: |
          echo "✅ Successfully built Docker images"
          echo ""
          echo "Version: ${{ steps.gitversion.outputs.semVer }}"
          echo "Platforms: linux/amd64, linux/arm64"
          echo ""
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "ℹ️  Images built but not published (not on main branch)"
          fi

  publish:
    name: Publish to Docker Hub
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1.1.1
        with:
          useConfigFile: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker tags
        id: docker-tags
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          MAJOR="${{ steps.gitversion.outputs.major }}"
          MINOR="${{ steps.gitversion.outputs.minor }}"

          TAGS="${{ env.IMAGE_NAME }}:${VERSION}"
          TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest"
          TAGS="${TAGS},${{ env.IMAGE_NAME }}:${MAJOR}"
          TAGS="${TAGS},${{ env.IMAGE_NAME }}:${MAJOR}.${MINOR}"

          echo "Tags to publish:"
          echo "  - ${VERSION} (full semver)"
          echo "  - latest"
          echo "  - ${MAJOR} (major version)"
          echo "  - ${MAJOR}.${MINOR} (major.minor version)"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Push Docker image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.gitversion.outputs.semVer }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64

  # Step 3: Create GitHub Release (only on main branch, after publish)
  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1.1.1
        with:
          useConfigFile: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: Release v${{ steps.gitversion.outputs.semVer }}
          body: |
            ## Conduit Localnet Importer v${{ steps.gitversion.outputs.semVer }}

            Multi-platform Docker images for Conduit with localnet importer plugin.

            ### Docker Images

            Images are available on Docker Hub for multiple architectures (amd64, arm64):

            ```bash
            # Pull latest version
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Pull specific version
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.semVer }}

            # Pull major version (gets latest patch)
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.major }}

            # Pull major.minor version (gets latest patch)
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}
            ```
            ---
            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "✅ Successfully created GitHub Release"
          echo ""
          echo "Release: v${{ steps.gitversion.outputs.semVer }}"
          echo "Tag: v${{ steps.gitversion.outputs.semVer }}"
