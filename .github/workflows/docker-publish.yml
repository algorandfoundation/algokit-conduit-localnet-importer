name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: makerxstudio/conduit-localnet-importer

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1.1.1
        with:
          useConfigFile: true

      - name: Display GitVersion outputs
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "Major: ${{ steps.gitversion.outputs.major }}"
          echo "Minor: ${{ steps.gitversion.outputs.minor }}"
          echo "Patch: ${{ steps.gitversion.outputs.patch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker tags
        id: docker-tags
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          MAJOR="${{ steps.gitversion.outputs.major }}"
          MINOR="${{ steps.gitversion.outputs.minor }}"

          # Always include full semver tag
          TAGS="${{ env.IMAGE_NAME }}:${VERSION}"

          # On main branch, also publish with latest and rolling version tags
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest"
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:${MAJOR}"
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:${MAJOR}.${MINOR}"

            echo "Publishing to main branch with tags:"
            echo "  - ${VERSION} (full semver)"
            echo "  - latest"
            echo "  - ${MAJOR} (major version)"
            echo "  - ${MAJOR}.${MINOR} (major.minor version)"
          else
            echo "Building for branch/PR - will not push to Docker Hub"
            echo "  - ${VERSION} (full semver)"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.docker-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.gitversion.outputs.semVer }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "✅ Successfully published Docker images to Docker Hub"
          echo ""
          echo "Tags published:"
          echo "${{ steps.docker-tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/  - /'
          echo ""
          echo "Pull with:"
          echo "  docker pull makerxstudio/conduit-localnet-importer:latest"
          echo "  docker pull makerxstudio/conduit-localnet-importer:${{ steps.gitversion.outputs.semVer }}"

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1.1.1
        with:
          useConfigFile: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: Release v${{ steps.gitversion.outputs.semVer }}
          body: |
            ## Conduit Localnet Importer v${{ steps.gitversion.outputs.semVer }}

            Multi-platform Docker images for Conduit with localnet importer plugin.

            ### Docker Images

            Images are available on Docker Hub for multiple architectures (amd64, arm64):

            ```bash
            # Pull latest version
            docker pull makerxstudio/conduit-localnet-importer:latest

            # Pull specific version
            docker pull makerxstudio/conduit-localnet-importer:v${{ steps.gitversion.outputs.semVer }}

            # Pull major version (gets latest patch)
            docker pull makerxstudio/conduit-localnet-importer:${{ steps.gitversion.outputs.major }}

            # Pull major.minor version (gets latest patch)
            docker pull makerxstudio/conduit-localnet-importer:${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}
            ```

            ---
            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
