mode: Mainline
increment: Inherit
branches:
  main:
    regex: ^main$
    tag: ''
    increment: Inherit
    is-mainline: true
    is-release-branch: true
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDelivery
    tag: PullRequest
    increment: Inherit
    tag-number-pattern: '[/-](?<number>\d+)'
  feature:
    regex: ^(feat|features?)[/-]
    mode: ContinuousDelivery
    tag: '{BranchName}'
    increment: Inherit
  development:
    regex: .+
    mode: ContinuousDelivery
    tag: '{BranchName}'
    increment: Inherit
commit-message-incrementing: Enabled
major-version-bump-message: '\+semver:\s?(breaking|major)|^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^\)]*\))?!(\s*:|\s+)|BREAKING[- ]CHANGE:'
minor-version-bump-message: '\+semver:\s?(feature|minor)|^feat(\([^\)]*\))?:'
patch-version-bump-message: '\+semver:\s?(fix|patch)|^(fix|bug)(\([^\)]*\))?:'
no-bump-message: '\+semver:\s?(none|skip)|^(chore|docs|style|refactor|test|build|ci)(\([^\)]*\))?:'
tag-prefix: 'v'
ignore:
  sha: []
